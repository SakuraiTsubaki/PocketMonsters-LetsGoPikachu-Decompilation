name: Build portable Gen VII Switch toolcache

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/toolcache.yml]

permissions:
  contents: write

concurrency:
  group: gen7-switch-toolcache
  cancel-in-progress: false

env:
  TAG: toolcache-2026-09-16
  ASSET: gen7-switch-toolcache-linux-x86_64.tar.gz

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build portable cache
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git curl unzip make python3 pkg-config
          W="$RUNNER_TEMP/gen7-toolcache"; B="$W/bundle"; S="$W/src"; D="$W/downloads"; mkdir -p "$B/bin" "$B/emulators" "$B/ghidra" "$B/jdk" "$S" "$D"

          git clone --depth=1 --recursive https://github.com/SciresM/hactool.git "$S/hactool"
          cp "$S/hactool/config.mk.template" "$S/hactool/config.mk"
          make -C "$S/hactool" -j"$(nproc)"
          install -m755 "$S/hactool/hactool" "$B/bin/hactool"

          curl -fL --retry 3 https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip -o "$D/ghidra.zip"
          echo '93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54  '"$D/ghidra.zip" | sha256sum -c -
          mkdir "$W/ghidra-unpack"; unzip -q "$D/ghidra.zip" -d "$W/ghidra-unpack"; cp -a "$(find "$W/ghidra-unpack" -mindepth 1 -maxdepth 1 -type d | head -n1)/." "$B/ghidra/"

          curl -fL --retry 3 'https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jdk/hotspot/normal/eclipse' -o "$D/jdk.tar.gz"
          tar -xzf "$D/jdk.tar.gz" -C "$B/jdk" --strip-components=1

          curl -fL --retry 3 'https://git.eden-emu.dev/api/v1/repos/eden-ci/master/releases?limit=20' -o "$D/eden-releases.json"
          python3 - "$D/eden-releases.json" "$D/eden-selection.txt" <<'PY'
          import json, sys
          releases=json.load(open(sys.argv[1],encoding='utf-8'))
          for rel in releases:
              if rel.get('draft') or rel.get('prerelease'): continue
              assets=rel.get('assets') or []
              imgs=[a for a in assets if (a.get('name') or '').lower().endswith('.appimage') and any(x in (a.get('name') or '').lower() for x in ('amd64','x86_64'))]
              if not imgs: continue
              imgs.sort(key=lambda a:(0 if 'pgo' in (a.get('name') or '').lower() else 1,a.get('name') or ''))
              a=imgs[0]; url=a.get('browser_download_url') or a.get('download_url') or a.get('url')
              if url:
                  open(sys.argv[2],'w',encoding='utf-8').write(f"{rel.get('tag_name','unknown')}\t{a.get('name','eden.AppImage')}\t{url}\n")
                  break
          else:
              raise SystemExit('no stable x86_64 Eden AppImage found')
          PY
          IFS=$'\t' read -r EDEN_TAG EDEN_NAME EDEN_URL < "$D/eden-selection.txt"
          curl -fL --retry 3 "$EDEN_URL" -o "$B/emulators/eden.AppImage"
          chmod +x "$B/emulators/eden.AppImage"

          cat > "$B/bin/ghidraRun" <<'EOF'
          #!/usr/bin/env bash
          D="$(cd "$(dirname "$0")/.." && pwd)"; export JAVA_HOME="$D/jdk"; exec "$D/ghidra/ghidraRun" "$@"
          EOF
          cat > "$B/bin/analyzeHeadless" <<'EOF'
          #!/usr/bin/env bash
          D="$(cd "$(dirname "$0")/.." && pwd)"; export JAVA_HOME="$D/jdk"; exec "$D/ghidra/support/analyzeHeadless" "$@"
          EOF
          cat > "$B/bin/eden" <<'EOF'
          #!/usr/bin/env bash
          D="$(cd "$(dirname "$0")/.." && pwd)"; export APPIMAGE_EXTRACT_AND_RUN=1; exec "$D/emulators/eden.AppImage" "$@"
          EOF
          chmod +x "$B/bin/ghidraRun" "$B/bin/analyzeHeadless" "$B/bin/eden"
          cat > "$B/env.sh" <<'EOF'
          #!/usr/bin/env bash
          _D="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"; export JAVA_HOME="$_D/jdk"; export PATH="$_D/bin:$JAVA_HOME/bin:$PATH"; unset _D
          EOF
          chmod +x "$B/env.sh"

          {
            echo 'platform=nintendo-switch'
            echo 'ghidra=12.1.3'
            echo "eden=$EDEN_TAG"
            echo "eden_asset=$EDEN_NAME"
            echo "hactool_commit=$(git -C "$S/hactool" rev-parse HEAD)"
            "$B/jdk/bin/java" -version 2>&1 | head -n1 | sed 's/^/java=/'
            sha256sum "$B/bin/hactool" "$B/emulators/eden.AppImage"
          } > "$B/MANIFEST.txt"
          cat > "$B/UPSTREAMS.txt" <<'EOF'
          hactool: https://github.com/SciresM/hactool
          Ghidra: https://github.com/NationalSecurityAgency/ghidra
          Temurin JDK 21: https://adoptium.net/
          Eden: https://git.eden-emu.dev/eden-ci/master/releases
          No ROMs, title keys, firmware, or proprietary game payloads are included.
          EOF

          tar -C "$B" -czf "$GITHUB_WORKSPACE/$ASSET" .
          cd "$GITHUB_WORKSPACE"; sha256sum "$ASSET" > "$ASSET.sha256"

      - name: Publish durable toolcache release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
          else
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" --title 'Generation VII portable toolcache' --notes 'Prebuilt Linux x86_64 analysis toolcache. Contains open-source tools/emulator/runtime only; no ROMs, keys, firmware, or game payloads.'
          fi
